services:
  data-server:
    image: "blaze:latest"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g"
      EXTERN_VALIDATOR_URL: "http://fhir-validator:8080"
      VALIDATOR_FAILURE_MODE: "${VALIDATOR_FAILURE_MODE:-tag-outcome}"
      LOG_LEVEL: debug
    ports:
    - "8080:8080"
    volumes:
    - "blaze-data:/app/data"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      fhir-validator:
        condition: service_healthy

  terminology-server:
    image: "blaze:latest"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8g"
      ENABLE_TERMINOLOGY_SERVICE: "true"
      ENABLE_TERMINOLOGY_LOINC: "true"
      ENABLE_TERMINOLOGY_SNOMED_CT: "true"
      SNOMED_CT_RELEASE_PATH: "/app/sct-release"
      LOG_LEVEL: debug
    ports:
    - "8082:8080"
    volumes:
    - "blaze-terminology-data:/app/data"
    - "./SnomedCT_InternationalRF2_PRODUCTION_20250701T120000Z:/app/sct-release"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fhir-validator:
    image: "ghcr.io/medizininformatik-initiative/mii-fhir-validator:0.0.1-alpha.7@sha256:c237b8b36a641cc57a59be2d2a29035ca4f39e0b6c71b26ab4e88e7f7c4fd6a1"
    environment:
      JAVA_OPTS: "-Xmx2g"
      TX_SERVER: "http://terminology-server:8080/fhir"
      # Override the MII IG defaults of the image with US Core 3.1.1, the
      # version of the profiles the Synthea test data was generated against.
      # Later US Core versions retire code systems the data still references
      # (like us-core-provenance-participant-type), which would produce
      # validation errors that say nothing about Blaze.
      IG_PARAMS: "-ig hl7.fhir.us.core#3.1.1"
    ports:
    - "8084:8080"
    # The validator only starts serving after it has loaded all implementation
    # guides, which takes several minutes. Without this healthcheck the data
    # server would start accepting writes while the validator is still starting
    # up and reject them with `503 Service Unavailable`.
    healthcheck:
      test: [ "CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/fhir+json",
              "-d", "{\"resourceType\":\"Patient\"}", "http://localhost:8080/validateResource" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    depends_on:
      terminology-server:
        condition: service_healthy

volumes:
  blaze-data:
  blaze-terminology-data:
