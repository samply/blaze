services:
  data-server:
    image: "blaze:latest"
    read_only: true
    tmpfs:
    - "/tmp:exec"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g"
      EXTERN_TERMINOLOGY_SERVICE_URL: "http://terminology-server:8080/fhir"
      EXTERN_VALIDATOR_URL: "http://fhir-validator:8080"
      LOG_LEVEL: debug
    ports:
    - "8080:8080"
    volumes:
    - "blaze-data:/app/data"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      fhir-validator:
        condition: service_started

  terminology-server:
    image: "blaze:latest"
    read_only: true
    tmpfs:
    - "/tmp:exec"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8g"
      ENABLE_TERMINOLOGY_SERVICE: "true"
      ENABLE_TERMINOLOGY_LOINC: "true"
      ENABLE_TERMINOLOGY_SNOMED_CT: "true"
      SNOMED_CT_RELEASE_PATH: "/app/sct-release"
      LOG_LEVEL: debug
    ports:
    - "8082:8080"
    volumes:
    - "blaze-terminology-data:/app/data"
    - "./SnomedCT_InternationalRF2_PRODUCTION_20250701T120000Z:/app/sct-release"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fhir-validator:
    image: "ghcr.io/medizininformatik-initiative/mii-fhir-validator:0.0.1-alpha.8@sha256:4a60074f0f780c9d497b68f67b7c62da886554fc156e19bb035f77962c363f26"
    # Load the cqfmeasures IG, which defines the cqfm-populationBasis extension
    # used in Measure resources created by blazectl, at startup in addition to
    # the default IGs. Otherwise the validator would download and load it on
    # first use, which takes too long for a single validation request.
    entrypoint:
    - "/bin/sh"
    - "-c"
    - 'IG_PARAMS="$$DEFAULT_IG_PARAMS -ig hl7.fhir.us.cqfmeasures#5.0.0" exec /bin/sh /app/docker-entrypoint.sh'
    environment:
      JAVA_OPTS: "-Xmx4g"
      TX_SERVER: "http://terminology-server:8080/fhir"
    ports:
    - "8084:8080"
    depends_on:
      terminology-server:
        condition: service_healthy

volumes:
  blaze-data:
  blaze-terminology-data:
