# Blaze against a fake OpenID provider serving prepared documents, generated by
# .github/scripts/openid-auth-limits/generate.sh into $OPENID_AUTH_LIMITS_DIR.
services:
  provider:
    image: "nginx:1.31.9@sha256:08f354a3b44c422021a5c0f5efb3e27f8f90236b5447d3bac4053f5f50ab6760"
    volumes:
    - "${OPENID_AUTH_LIMITS_DIR}/www:/usr/share/nginx/html:ro"

  blaze-mixed:
    image: "blaze:latest"
    read_only: true
    tmpfs:
    - "/tmp:exec"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      LOG_LEVEL: "debug"
      OPENID_PROVIDER_URL: "http://provider/mixed"
      OPENID_PROVIDER_ISSUER: "http://provider/mixed"
      OPENID_AUDIENCE: "blaze"
    ports:
    - "8080:8080"
    volumes:
    - "blaze-mixed-data:/app/data"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
    - provider

  blaze-jwks-too-large:
