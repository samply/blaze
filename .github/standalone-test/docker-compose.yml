services:
  blaze:
    image: "blaze:latest"
    read_only: true
    tmpfs:
    - "/tmp:exec"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g -XX:-UseBASE64Intrinsics"
      LOG_LEVEL: "debug"
      ALLOW_MULTIPLE_DELETE: "true"
      ENABLE_INTERACTION_DELETE_HISTORY: "${ENABLE_INTERACTION_DELETE_HISTORY:-false}"
      ENABLE_INTERACTION_DELETE_HISTORY_VERSION: "${ENABLE_INTERACTION_DELETE_HISTORY_VERSION:-false}"
      ENABLE_OPERATION_PATIENT_PURGE: "${ENABLE_OPERATION_PATIENT_PURGE:-false}"
      ENABLE_OPERATION_GRAPH: "${ENABLE_OPERATION_GRAPH:-false}"
      ENABLE_OPERATION_CQL: "${ENABLE_OPERATION_CQL:-false}"
      JVM_METRICS_LOGGER_INTERVAL: "PT1M"
    ports:
    - "8081:8081"
    volumes:
    - "blaze-data:/app/data"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingress:
    image: "nginx:1.31.9@sha256:08f354a3b44c422021a5c0f5efb3e27f8f90236b5447d3bac4053f5f50ab6760"
    ports:
    - "8080:8080"
    volumes:
    - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      blaze:
        condition: service_healthy

volumes:
  blaze-data:
