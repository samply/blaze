name: Docs

on:
  schedule:
  - cron: '0 10 * * *' # every day at 10am
  push:
    branches:
    - main
    tags:
    - 'v*.*.*'
  pull_request:
    branches:
    - main
  merge_group:
  workflow_dispatch:

permissions: read-all

jobs:
  build-pages:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out Git repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: 'docs/package-lock.json'

    - name: Install Cosign
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4

    - name: Collect Latest Release Information
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(gh release view --json tagName --jq '.tagName')
        version=${version:-v0.0.0}
        echo "version=${version}" >>"$GITHUB_OUTPUT"

        digest=$(cosign verify "samply/blaze:${version#v}" \
          --certificate-identity-regexp "https://github.com/samply/blaze/.*" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          -o json 2>/dev/null | jq -r '.[0].critical.image["docker-manifest-digest"]')
        echo "digest=${digest}" >>"$GITHUB_OUTPUT"

        frontend_digest=$(cosign verify "samply/blaze-frontend:${version#v}" \
          --certificate-identity-regexp "https://github.com/samply/blaze/.*" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          -o json 2>/dev/null | jq -r '.[0].critical.image["docker-manifest-digest"]')
        echo "frontend_digest=${frontend_digest}" >>"$GITHUB_OUTPUT"

        cosign verify "samply/blaze:${version#v}@${digest}" \
          --certificate-identity-regexp "https://github.com/samply/blaze/.*" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          --certificate-github-workflow-ref="refs/tags/${version}" \
          -o text >/dev/null 2>docs/cosign-verify.txt

        cosign verify "samply/blaze-frontend:${version#v}@${frontend_digest}" \
          --certificate-identity-regexp "https://github.com/samply/blaze/.*" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          --certificate-github-workflow-ref="refs/tags/${version}" \
          -o text >/dev/null 2>docs/cosign-verify-frontend.txt

    - name: Replace Compose Latest Tags
      env:
        RELEASE: ${{ steps.release.outputs.version }}
        DIGEST: ${{ steps.release.outputs.digest }}
        FRONTEND_DIGEST: ${{ steps.release.outputs.frontend_digest }}
      run: |
        find ./docs -type f -exec sed -i \
          -e "s|samply/blaze:latest|samply/blaze:${RELEASE#v}@${DIGEST}|g" \
          -e "s|samply/blaze-frontend:latest|samply/blaze-frontend:${RELEASE#v}@${FRONTEND_DIGEST}|g" \
        {} +

    - name: Build
      working-directory: docs
      env:
        VITE_LATEST_RELEASE: ${{ steps.release.outputs.version }}
        VITE_LATEST_DIGEST: ${{ steps.release.outputs.digest }}
        VITE_LATEST_FRONTEND_DIGEST: ${{ steps.release.outputs.frontend_digest }}
      run: make build

    - name: Test IG Resolver
      run: make -C modules/ig-resolver test

    - name: Setup IG Render Toolchain
      uses: ./.github/actions/setup-ig-render

    # The guide is rendered from the same commit as the documentation around
    # it, so that a page and the definition it describes never disagree.
    # Rendering takes about a minute and a half, so it's done on every build
    # rather than cached.
    - name: Render IG
      run: make -C modules/ig publish

    - name: Add IG to Site
      run: make -C docs add-ig

    # The index of the resources of the guide is built from the same render as
    # the site, so the Worker resolves exactly the files that are deployed.
    - name: Index IG Resources
      run: make -C modules/ig-resolver index

    - name: Check that the IG Defines All Canonicals
      run: .github/scripts/check-ig-canonicals.sh

    - name: Upload IG Index
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ig-resolver-index
        path: modules/ig-resolver/target

    - name: Setup Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: docs/.vitepress/dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [ build-pages ]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # The IG resolver is deployed after the site, so that a route of the resolver
  # never points at a file that isn't live yet. Its credentials live in the
  # github-pages environment, which only main can use. Installing and deploying
  # are skipped until they are configured. That's checked per step, because the
  # variables of an environment aren't available yet in the `if` of a job.
  deploy-ig-resolver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [ deploy-pages ]
    environment:
      name: github-pages
      url: https://blaze-server.org/fhir/
    steps:
    - name: Check out Git repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: 'modules/ig-resolver/package-lock.json'

    - name: Download IG Index
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ig-resolver-index
        path: modules/ig-resolver/target

    # Separate from the deploy, so that the install scripts of the dependencies
    # don't run with the Cloudflare token in their environment.
    - name: Install IG Resolver
      if: vars.CLOUDFLARE_ACCOUNT_ID != ''
      run: make -C modules/ig-resolver install

    - name: Deploy IG Resolver
      if: vars.CLOUDFLARE_ACCOUNT_ID != ''
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: 'false'
      run: make -C modules/ig-resolver deploy
